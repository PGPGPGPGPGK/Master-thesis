# Argoverse-HD dataset config (ring-front-center camera)
# Source: https://www.cs.cmu.edu/~mengtial/proj/streaming/ (Argo AI)
# Docs: https://docs.ultralytics.com/datasets/detect/argoverse/
#
# Run scripts/convert_argoverse_to_yolo.py first to generate YOLO labels,
# then point `path` below at your local dataset root.

path: ../datasets/Argoverse # dataset root dir
train: Argoverse-1.1/images/train/ # train images (relative to 'path')
val: Argoverse-1.1/images/val/ # val images (relative to 'path')
test: Argoverse-1.1/images/test/ # test images (optional)

# Classes (as actually configured in the recovered thesis run;
# see docs/images/class_names_config.png)
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle
  4: bus
  5: big car
  6: traffic_light
  7: stop_sign
